<div class="enerccio_memmanager_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="{{title}}">{{title}}</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="enerccio_memmanager_settings_content">

                <table>

                    <tr title="The connection profile to use for memory manager.">
                        <td><span>Connection Profile</span></td>
                        <td><select id="connection_profile" class="text_pole"></select></td>
                    </tr>

                </table>

                <div class="flex-container justifyspacebetween alignitemscenter">
                    <label for="enerccio_memmanager_npcgen_prompt">NPC Search Prompt</label>
                    <textarea id="enerccio_memmanager_npcgen_prompt" cols="8"></textarea>
                </div>

                <div class="flex-container justifyspacebetween alignitemscenter">
                    <label for="enerccio_memmanager_memoryupdate_prompt">NPC Memory Update Prompt</label>
                    <textarea id="enerccio_memmanager_memoryupdate_prompt" cols="8"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
